<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AimDock</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, system-ui, sans-serif;
        background: #0a0c0f;
        color: #e6edf3;
        display: grid;
        place-items: center;
      }
      main {
        width: min(680px, 90vw);
      }
      h1 {
        margin-top: 0;
        font-size: 2rem;
      }
      button {
        border: 1px solid #30363d;
        background: #161b22;
        color: #e6edf3;
        padding: 0.75rem 1rem;
        border-radius: 8px;
        cursor: pointer;
      }
      #devices {
        margin-top: 1rem;
        border: 1px solid #30363d;
        border-radius: 10px;
        padding: 1rem;
        background: #11161d;
        min-height: 2.5rem;
      }
      .device-list {
        display: grid;
        gap: 0.75rem;
      }
      .device-card {
        width: 100%;
        text-align: left;
      }
      #status {
        margin-top: 1rem;
        min-height: 1.5rem;
      }
      #stop-stream,
      #enable-input,
      #disable-input {
        display: none;
        margin-top: 0.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>AimDock</h1>
      <button id="scan">Scan for Devices</button>
      <div id="devices">Click "Scan for Devices" to detect connected phones.</div>
      <div id="status" role="status"></div>
      <button id="stop-stream">Stop Stream</button>
      <button id="enable-input">Enable Input (F1)</button>
      <button id="disable-input">Disable Input</button>
    </main>

    <script type="module">
      import { invoke } from "@tauri-apps/api/core";

      const scanButton = document.getElementById("scan");
      const devicesEl = document.getElementById("devices");
      const statusEl = document.getElementById("status");
      const stopStreamButton = document.getElementById("stop-stream");
      const enableInputButton = document.getElementById("enable-input");
      const disableInputButton = document.getElementById("disable-input");
      let currentSerial = null;

      const setInputActive = (isActive) => {
        enableInputButton.style.display = currentSerial && !isActive ? "inline-block" : "none";
        disableInputButton.style.display = isActive ? "inline-block" : "none";
      };

      const setStreaming = (isStreaming) => {
        stopStreamButton.style.display = isStreaming ? "inline-block" : "none";
        if (!isStreaming) {
          currentSerial = null;
          setInputActive(false);
        }
      };

      const startStream = async (serial) => {
        statusEl.textContent = "Starting stream...";

        try {
          await invoke("start_stream", { serial });
          currentSerial = serial;
          statusEl.textContent = "Streaming...";
          setStreaming(true);
          setInputActive(false);
        } catch (error) {
          statusEl.textContent = `Failed to start stream: ${error}`;
          setStreaming(false);
          setInputActive(false);
        }
      };

      stopStreamButton.addEventListener("click", async () => {
        try {
          await invoke("stop_input");
          await invoke("stop_stream");
          statusEl.textContent = "Stream stopped.";
          setStreaming(false);
          setInputActive(false);
        } catch (error) {
          statusEl.textContent = `Failed to stop stream: ${error}`;
        }
      });

      enableInputButton.addEventListener("click", async () => {
        if (!currentSerial) {
          statusEl.textContent = "Start a stream before enabling input.";
          return;
        }

        try {
          await invoke("start_input", { serial: currentSerial });
          statusEl.textContent = "Input active — F1 to toggle";
          setInputActive(true);
        } catch (error) {
          statusEl.textContent = `Failed to enable input: ${error}`;
          setInputActive(false);
        }
      });

      disableInputButton.addEventListener("click", async () => {
        try {
          await invoke("stop_input");
          statusEl.textContent = "Input disabled.";
          setInputActive(false);
        } catch (error) {
          statusEl.textContent = `Failed to disable input: ${error}`;
        }
      });

      scanButton.addEventListener("click", async () => {
        devicesEl.textContent = "Scanning...";

        try {
          const devices = await invoke("list_devices");

          if (!Array.isArray(devices) || devices.length === 0) {
            devicesEl.textContent = "No devices found. Connect your phone via USB.";
            return;
          }

          const list = document.createElement("div");
          list.className = "device-list";
          devices.forEach((serial) => {
            const deviceButton = document.createElement("button");
            deviceButton.type = "button";
            deviceButton.className = "device-card";
            deviceButton.textContent = serial;
            deviceButton.addEventListener("click", () => startStream(serial));
            list.appendChild(deviceButton);
          });

          devicesEl.innerHTML = "";
          devicesEl.appendChild(list);
        } catch (error) {
          devicesEl.textContent = `Failed to scan devices: ${error}`;
        }
      });
    </script>
  </body>
</html>
